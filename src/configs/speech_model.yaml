defaults:
  - decode: decode
  - model: speech_model
  - writer: cometml_SpeechModel
  - metrics: example
  - datasets: example
  - dataloader: SpeechModel
  - transforms: example_only_instance
  - text_encoder: text_encoder
  - _self_

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  weight_decay: 1e-3
  betas: [0.9, 0.98]
  eps: 1e-8

lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 2e-4
  pct_start: 0.1
  anneal_strategy: cos
  div_factor: 25
  final_div_factor: 100
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}

loss_function:
  _target_: src.loss.CTCLossWrapper

text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

trainer:
  log_step: 25
  n_epochs: 60
  epoch_len: 400
  device_tensors: ["spectrogram", "text_encoded"]
  resume_from: null
  device: auto
  override: True
  monitor: "min val_WER_${decode.mode}"
  save_period: 5
  early_stop: 15
  save_dir: "saved"
  seed: 42
